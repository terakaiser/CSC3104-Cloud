# Deadline frozen from a 5-round healthy synchronous pilot on the real ULB partitions
# (local Flower runtime): rounds took 22.1-24.9 s, so 40 s gives 1.6x the slowest round.
# The slow scenario's 45 s delay still overshoots it, so the straggler is real.
seeds: [42, 43, 44]
rounds: 20
deadline: 40
scenarios:
  healthy:
    scenario: healthy
  slow:
    scenario: slow
    delay: 45
    fault_attempt: 2
  unavailable:
    scenario: unavailable
  stale:
    scenario: stale
    fault_attempt: 2
