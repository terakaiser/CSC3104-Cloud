apiVersion: batch/v1
kind: Job
metadata:
  name: training-run
  namespace: crossbank
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true}
      containers:
        - name: submit
          image: crossbank-fl:local
          imagePullPolicy: IfNotPresent
          command: ["flwr", "run", "/app", "local-deployment", "--run-config", "/app/docker/run-config.toml", "--stream"]
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
