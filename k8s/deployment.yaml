        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: bank-1
        image: bank-fl:0.1.0
        imagePullPolicy: IfNotPresent
        command:
        - flower-supernode
        - --insecure
        - --health-server-address
        - 0.0.0.0:9095
        - --superlink
        - coordinator:9092
        - --clientappio-api-address
        - 127.0.0.1:9094
        - --node-config
        - bank-id="bank-1"
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          grpc:
            port: 9095
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          grpc:
            port: 9095
          periodSeconds: 5
        livenessProbe:
          grpc:
            port: 9095
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: data
        hostPath:
          path: /mnt/bank-fl/bank-1
          type: Directory
