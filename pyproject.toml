[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossbank-fl"
version = "0.1.0"
description = "Cross-bank federated fraud detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flwr[simulation]==1.28.0",
    "torch>=2.2,<3",
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
data = ["kagglehub>=1,<2"]
research = ["matplotlib>=3.8,<4", "xgboost", "joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/crossbank"]

[tool.flwr.app]
publisher = "cloud-team-18"

[tool.flwr.app.components]
serverapp = "crossbank.fl.server_app:app"
clientapp = "crossbank.fl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 2
local-epochs = 1
batch-size = 1024
learning-rate = 0.001
max-samples = 100000
seed = 42
data-dir = "data/processed"
output-dir = "results/runs"
round-timeout = 300.0
